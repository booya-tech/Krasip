# bug.yml
# Krasip
# Something the app itself did wrong, as opposed to the speech model. Krasip's "Report a Miss" button files this
# when the reporter picks "Something else".

name: Report a bug
description: Something the app did wrong. Wrong window, stuck overlay, shortcut not firing.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If the text came out wrong but landed in the right place, that is a model miss,
        not a bug. File it on `krasip-correction` instead, or use **Report a Miss…** in
        Krasip's History and pick what went wrong there.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: The text landed in the wrong window.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: What were you doing when it happened?
      description: Enough for someone else to hit the same thing.

  - type: textarea
    id: history
    attributes:
      label: From History
      description: Krasip fills this in when the report comes from the Report a Miss button.
